appId: local.chirp.dictation
productName: Chirp
npmRebuild: false
files:
  - assets/tray*.png
  - assets/icon.png
  - assets/chirp.svg
  - out/**/*
  - src/renderer/*.html
  - src/renderer/*.css
  - package.json
asarUnpack:
  - node_modules/sherpa-onnx*/**/*
extraResources:
  - from: models
    to: models
    filter: ["**/*", "!**/test_wavs/**/*"]
win:
  icon: assets/chirp.ico
  target: nsis
  extraResources:
    - from: build/chirp-input.exe
      to: chirp-input.exe
  extraFiles:
    - from: native/windows/terms.txt
      to: Chirp Terms.txt
linux:
  executableName: chirp-dictation
  target:
    - tar.gz
  icon: assets/icon.png
  category: Utility
  extraResources:
    - from: build/chirp-input
      to: chirp-input
    - from: native/linux/chirp-sway.conf
      to: chirp-sway.conf
nsis:
  license: native/windows/terms.txt
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: true
  differentialPackage: false
  useZip: true
  include: native/windows/startup.nsh
  artifactName: Chirp Setup.exe
