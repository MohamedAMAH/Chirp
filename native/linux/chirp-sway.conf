# Include this file from your Sway config, then reload Sway.
no_focus [app_id="^local[.]chirp[.]dictation$" title="^Chirp indicator$"]
for_window [app_id="^local[.]chirp[.]dictation$" title="^Chirp indicator$"] floating enable, border none, sticky enable

bindsym --no-repeat Alt_R nop chirp:down
bindsym --release Alt_R nop chirp:up
bindsym --no-repeat Ctrl+n nop chirp:mode
bindsym --no-repeat Ctrl+b nop chirp:auto-enter
bindsym --no-repeat Ctrl+q nop chirp:quit
